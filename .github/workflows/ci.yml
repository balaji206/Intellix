name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  api:
    name: Node API (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci
      - run: npm run build

  rag-service:
    name: FastAPI service (import check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/rag-service/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m compileall app
      - run: python -c "import app.main; print('import ok')"